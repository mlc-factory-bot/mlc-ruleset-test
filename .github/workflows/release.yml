name: release
on:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
  actions: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ship only founder-approved product changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/founder_gate.py release "$GITHUB_REPOSITORY" "$GITHUB_SHA" release.yml
      - name: Deploy (stand-in)
        run: echo "would deploy $GITHUB_SHA"
